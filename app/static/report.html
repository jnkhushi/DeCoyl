<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeCoyl — Compliance Report</title>
<style>
  :root{--ink:#14233a;--muted:#5b6b80;--line:#d9e1ea;--teal:#5f6fe6;--teal-d:#4a3fcf;
        --safe:#1f9d57;--susp:#c98a12;--danger:#c23b3b;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  .sheet{max-width:820px;margin:24px auto;background:#fff;border:1px solid var(--line);
         border-radius:10px;padding:34px 40px;box-shadow:0 2px 14px rgba(20,35,58,.06)}
  .bar{max-width:820px;margin:0 auto;display:flex;gap:10px;justify-content:flex-end;padding:0 4px}
  button{background:var(--teal);color:#fff;border:0;font-weight:600;padding:9px 16px;
         border-radius:8px;cursor:pointer}
  button.ghost{background:#fff;color:var(--teal);border:1px solid var(--teal)}
  button:hover{background:var(--teal-d);color:#fff}
  .brand{display:flex;justify-content:space-between;align-items:flex-start;
         border-bottom:3px solid var(--teal);padding-bottom:14px}
  .brand h1{margin:0;font-size:22px;letter-spacing:.3px}
  .brand .k{color:var(--teal);font-weight:700;font-size:12px;letter-spacing:1px}
  .brand .period{text-align:right;color:var(--muted);font-size:13px}
  .client{margin:18px 0 6px}.client b{font-size:18px}
  .client span{color:var(--muted)}
  h2{font-size:14px;letter-spacing:.5px;text-transform:uppercase;color:var(--teal-d);
     margin:26px 0 10px;border-bottom:1px solid var(--line);padding-bottom:5px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .kpi{border:1px solid var(--line);border-radius:8px;padding:12px;text-align:center}
  .kpi b{display:block;font-size:24px;color:var(--teal-d)}
  .kpi span{font-size:11px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  .pill{font-weight:700;font-size:11px;padding:2px 8px;border-radius:12px;white-space:nowrap}
  .v-dangerous{background:#fae7e7;color:var(--danger)}
  .v-suspicious{background:#faf1dc;color:var(--susp)}
  .b-low{color:var(--safe);font-weight:700}.b-medium{color:var(--susp);font-weight:700}
  .b-high{color:var(--danger);font-weight:700}
  .trend{display:flex;align-items:flex-end;gap:16px;height:110px;padding:8px 4px 0}
  .trend .col{flex:1;text-align:center}
  .trend .barv{background:var(--teal);border-radius:4px 4px 0 0;margin:0 auto;width:46px}
  .trend small{display:block;color:var(--muted);font-size:11px;margin-top:6px}
  .note{color:var(--muted);font-size:12px;font-style:italic;margin-top:6px}
  ul{margin:8px 0;padding-left:20px}li{margin:4px 0}
  footer{color:var(--muted);font-size:12px;margin-top:26px;border-top:1px solid var(--line);padding-top:12px}
  .loading{max-width:820px;margin:60px auto;text-align:center;color:var(--muted)}
  @media print{body{background:#fff}.bar{display:none}.sheet{border:0;box-shadow:none;margin:0;max-width:100%}}
</style>
</head>
<body>
<div class="bar">
  <button class="ghost" onclick="downloadJSON()">Download data (JSON)</button>
  <button onclick="window.print()">Print / Save as PDF</button>
</div>
<div id="root" class="loading">Loading report…</div>

<script>
const esc = s => (s??"").replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const cid = new URLSearchParams(location.search).get('client') || 'acme';
let REPORT = null;

async function load(){
  const r = await fetch(`/api/clients/${cid}/report`);
  if(!r.ok){ document.getElementById('root').textContent = 'Unknown client.'; return; }
  REPORT = await r.json();
  document.getElementById('root').className = '';
  document.getElementById('root').innerHTML = render(REPORT);
}

function render(d){
  const ep = d.email_protection, dp = d.detection_performance, tr = d.training, rt = d.risk_trend;
  const attacks = ep.attacks_caught.map(a=>`<tr>
     <td>${esc(a.subject)}<br><span style="color:#5b6b80">${esc(a.from)}</span></td>
     <td><span class="pill v-${a.verdict}">${a.verdict.toUpperCase()} · ${a.score}</span></td>
     <td>${esc(a.reason)}</td></tr>`).join('');
  const emps = tr.employees.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.role)}</td>
     <td>${e.tests}</td><td class="b-${e.band}">${e.human_risk}/100 (${e.band})</td></tr>`).join('');
  const maxTrend = Math.max(...rt.points, 1);
  const trend = rt.points.map((p,i)=>`<div class="col">
     <div class="barv" style="height:${Math.round(p/maxTrend*90)}px"></div>
     <b>${p}</b><small>${esc(rt.labels[i])}</small></div>`).join('');
  const evidence = d.evidence.map(x=>`<li>${esc(x)}</li>`).join('');

  return `<div class="sheet">
    <div class="brand">
      <div><div class="k">DECOYL</div><h1>Security &amp; Training Report</h1></div>
      <div class="period">Reporting period<br><b>${esc(d.period)}</b></div>
    </div>
    <div class="client"><b>${esc(d.client.name)}</b>
      <span>— ${esc(d.client.sector)} · ${esc(d.client.domain)} · ${d.client.employees} staff</span></div>

    <h2>Email protection</h2>
    <div class="kpis">
      <div class="kpi"><b>${ep.scanned}</b><span>emails scanned</span></div>
      <div class="kpi"><b>${ep.dangerous}</b><span>dangerous blocked</span></div>
      <div class="kpi"><b>${ep.suspicious}</b><span>suspicious flagged</span></div>
      <div class="kpi"><b>${ep.attacks_caught.length}</b><span>attacks caught</span></div>
    </div>
    <table style="margin-top:14px"><thead><tr><th>Threat</th><th>Verdict</th><th>Why it was flagged</th></tr></thead>
      <tbody>${attacks || '<tr><td colspan="3">No threats in this period.</td></tr>'}</tbody></table>

    <h2>Detection performance</h2>
    <div class="kpis">
      <div class="kpi"><b>${dp.detection_rate}%</b><span>detection rate</span></div>
      <div class="kpi"><b>${dp.baseline_rate}%</b><span>baseline filter</span></div>
      <div class="kpi"><b>+${dp.lift}</b><span>point lift</span></div>
      <div class="kpi"><b>${dp.false_positive_rate}%</b><span>false positives</span></div>
    </div>
    <p class="note">${esc(dp.note)}</p>

    <h2>Staff training</h2>
    <div class="kpis">
      <div class="kpi"><b>${tr.avg_human_risk}/100</b><span>avg human-risk</span></div>
      <div class="kpi"><b>${tr.report_rate}%</b><span>tests reported</span></div>
      <div class="kpi"><b>${tr.reported}</b><span>reported by staff</span></div>
      <div class="kpi"><b>${tr.fell_for}</b><span>fell for a test</span></div>
    </div>
    <table style="margin-top:14px"><thead><tr><th>Employee</th><th>Role</th><th>Tests</th><th>Human-risk</th></tr></thead>
      <tbody>${emps}</tbody></table>

    <h2>Human-risk over time</h2>
    <div class="trend">${trend}</div>
    <p class="note">Illustrative trend — a live deployment builds this from dated pilot history.</p>

    <h2>Evidence for your auditor / cyber-insurer</h2>
    <ul>${evidence}</ul>

    <footer>Generated by DeCoyl · ${esc(d.period)} · figures are illustrative.</footer>
  </div>`;
}

function downloadJSON(){
  if(!REPORT) return;
  const blob = new Blob([JSON.stringify(REPORT, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `decoyl-report-${cid}.json`;
  a.click(); URL.revokeObjectURL(a.href);
}

load();
</script>
</body>
</html>
