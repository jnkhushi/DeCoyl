# One-click deploy on Render (https://render.com). New > Blueprint > point at this repo.
services:
  - type: web
    name: decoyl
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Optional: set ANTHROPIC_API_KEY in the Render dashboard to enable live
      # Claude detection. The app runs on heuristics without it.
